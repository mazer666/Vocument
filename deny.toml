# cargo-deny configuration for Vocument (ROLE-16 Supply Chain & ROLE-18 Licensing)

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.8
# The licences that may travel with the product.
#
# The GNU licences are written in **both** spellings: `AGPL-3.0` is the
# *only* variant and `AGPL-3.0-or-later` the *or later* variant — in SPDX
# they are two different licences, and the bare name does not cover the
# suffixed one. The crates of the workspace carry `AGPL-3.0-or-later`, and
# cargo-deny checks the members of the workspace as well: without the
# suffixed spelling the check failed with "license is not explicitly
# allowed" on the crates of the project itself.
allow = [
    "AGPL-3.0",
    "AGPL-3.0-or-later",
    "GPL-3.0",
    "LGPL-3.0",
    "MPL-2.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
