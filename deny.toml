# cargo-deny configuration for Vocument (ROLE-16 Supply Chain & ROLE-18 Licensing)

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.8
# The GNU licences are written in their bare form: `AGPL-3.0` covers
# `AGPL-3.0-only` and `AGPL-3.0-or-later`. cargo-deny rejects the suffixed
# spellings with "expected a <bare-gnu-license> here".
allow = [
    "AGPL-3.0",
    "GPL-3.0",
    "LGPL-3.0",
    "MPL-2.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
