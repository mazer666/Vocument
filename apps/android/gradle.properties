# The Gradle daemon is limited to 1 GB heap.
#
# The release build runs R8 (the dexer) and the lint analysis. Together they
# need more memory than the build host has available in the CI container
# (3 GB in total, shared with the Kotlin compiler and the native build). With
# the default of 2 GB the daemon was killed during the packaging step, which
# produced a truncated APK. A smaller heap keeps the daemon alive, and the
# dexing runs with a lower peak memory instead.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.daemon=false
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
