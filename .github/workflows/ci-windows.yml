# The gate of the project on a GitHub-hosted Windows runner (CR-0003, PLATFORM-002).
#
# What this job proves:
#   * the build and test of the native Windows 11 application shell (apps/windows);
#   * the real P/Invoke native binding against Rust core (vocument-ffi);
#   * the execution of the shared acceptance scenario on Windows:
#     Open -> search -> select -> highlight -> rotate -> undo -> redo -> save -> recover -> reopen;
#   * the GUI end-to-end gate of the WinUI 3 shell (WindowsGuiEndToEndTests);
#   * the publication of the unpackaged WinUI 3 application and its internal artifact;
#   * enforcement of QA-003: no stubs, placeholders, or dummy return values.
#
# The job publishes nothing to a release and signs nothing: the internal artifact is
# uploaded as a workflow artifact for reviewers of the Windows track.
name: CI (Windows native)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-native:
    name: Windows — WinUI 3 shell, native FFI and acceptance scenario
    runs-on: windows-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-ci]')) ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
       (contains(github.event.pull_request.title, '[run-ci]') || contains(github.event.pull_request.body, '[run-ci]')))
    timeout-minutes: 90
    env:
      MUPDF_WINDOWS_DIR: ${{ github.workspace }}\target\mupdf-windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustc --version
          cargo --version

      - name: Setup MSBuild and Visual Studio toolchain
        uses: microsoft/setup-msbuild@v2

      - name: Prepare MuPDF Windows x64
        shell: pwsh
        run: |
          ./scripts/prepare-windows-mupdf.ps1 -OutputDirectory "${{ github.workspace }}\target\mupdf-windows"

      - name: Build Vocument FFI library
        shell: pwsh
        run: |
          $env:MUPDF_WINDOWS_DIR = "${{ github.workspace }}\target\mupdf-windows"
          $env:TESSERACT_WINDOWS_DIR = "${{ github.workspace }}\target\mupdf-windows"
          cargo build -p vocument-ffi

      - name: Run Windows Native Acceptance Tests
        shell: pwsh
        run: |
          $env:PATH = "${{ github.workspace }}\target\debug;${{ github.workspace }}\target\mupdf-windows\bin;$env:PATH"
          dotnet test apps/windows/VocumentApp.csproj --logger "console;verbosity=detailed"

      - name: Publish the WinUI 3 application
        shell: pwsh
        run: |
          $env:PATH = "${{ github.workspace }}\target\debug;${{ github.workspace }}\target\mupdf-windows\bin;$env:PATH"
          dotnet publish apps/windows/VocumentApp.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained false -o "${{ github.workspace }}\target\windows-distribution\VocumentWindows"

      - name: Assemble the internal Windows x64 distribution
        shell: pwsh
        run: |
          $distribution = "${{ github.workspace }}\target\windows-distribution"
          $application = Join-Path $distribution "VocumentWindows"

          # The native core library and the MuPDF runtime belong next to the application.
          Copy-Item -Path "${{ github.workspace }}\target\debug\vocument_ffi.dll" -Destination $application -Force
          Get-ChildItem -Path "${{ github.workspace }}\target\mupdf-windows\bin" -Filter *.dll -ErrorAction SilentlyContinue |
            Copy-Item -Destination $application -Force

          $archive = Join-Path $distribution "Vocument-Windows-x64-internal.zip"
          Compress-Archive -Path (Join-Path $application "*") -DestinationPath $archive -Force
          Get-Item $archive | Select-Object Name, Length

      - name: Upload the internal Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: vocument-windows-x64-internal
          path: target/windows-distribution/Vocument-Windows-x64-internal.zip
          if-no-files-found: error

      - name: GUI end-to-end gate (WinUI 3 shell)
        shell: pwsh
        run: |
          $env:PATH = "${{ github.workspace }}\target\debug;${{ github.workspace }}\target\mupdf-windows\bin;$env:PATH"
          dotnet test apps/windows/VocumentApp.csproj --filter "FullyQualifiedName~WindowsGuiEndToEndTests" --logger "console;verbosity=detailed"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "The GUI end-to-end gate failed."
            exit 1
          }
          echo "WINUI_GATE=PASS"
