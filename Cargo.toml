[workspace]
resolver = "2"
members = [
    "core/vocument-core",
    "engines/pdf-mupdf",
    "engines/ocr",
    "engines/imaging",
    "formats/pdoc",
    "platform/vocument-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/mazer666/Vocument"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
thiserror = "2.0"
uniffi = { version = "0.29", features = ["cli"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
