[workspace]
resolver = "2"
members = [
    "core/vocument-core",
    "core/vocument-flow",
    "engines/pdf-mupdf",
    "engines/ocr",
    "engines/imaging",
    "formats/pdoc",
    "platform/vocument-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/mazer666/Vocument"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
uniffi = { version = "0.29", features = ["cli"] }
sha2 = "0.10"
cc = "1.2"
rusqlite = { version = "0.32", features = ["bundled"] }
# The declarations of the C library of the system. They are used where the
# kernel reports something that the standard library of Rust does not offer —
# the peak memory of the process, for example. The crate is already in the
# tree of the workspace (through `rustix` and `getrandom`) and is already in
# the licence inventory of the third-party components.
libc = "0.2"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
