[package]
name = "vocument-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "vocument_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
vocument-core = { path = "../../core/vocument-core" }
vocument-pdf-mupdf = { path = "../../engines/pdf-mupdf" }
vocument-imaging = { path = "../../engines/imaging" }
vocument-ocr = { path = "../../engines/ocr" }
uniffi.workspace = true
thiserror.workspace = true

[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
