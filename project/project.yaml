    - "M2.5"
    # M2.1 covers the secure redaction with its verification in the core, the
    # engine and over the FFI boundary. The redaction was hardened after
    # four independent adversarial audits: the word boxes of a turned page,
    # the fragments of a partly covered word, the places of the document that
    # still carry the text, the rollback of a redaction that cannot be
    # verified, the rule that a marked region takes the whole word it
    # touches, the rollback after every error and the private checkpoints of
    # the recovery store, the systematic gap of the third audit (the search
    # and the cleaning work with a list of known places and now walk through
    # every object of the document) and the systematic gap of the fourth
    # audit (the walk did not descend into the dictionary of a stream, so a
    # copy of the text in a form object stayed in the document while the
    # redaction reported success) and the fifth audit (the keys of an
    # encrypted document were emptied when the encryption dictionary hangs
    # as an indirect object, and the search for the remaining text compared
    # bytes and did not see a word that the writer split over several show
    # operations). The sixth round of the red team (over the exported file)
    # found that the report of the places was cut off at 200 lines: a
    # document with 201 pages that carry the removed text pushed the note
    # about the place that could not be examined out of the report, and the
    # redaction was reported as verified while a place of the document had
    # never been looked into. The report grows with the document now, and an
    # incomplete report is a refused redaction. The step of the macOS
    # interface of the redaction was measured later on a macOS host — the
    # chain of the user is carried by the kit and proven by four tests, see
    # docs/acceptance/M2.1-ACCEPTANCE.md and
    # docs/acceptance/ROUND-5-ACCEPTANCE.md.
    - "M2.1"
    # M2.2 covers the inspection of the links and actions of a document: the
    # engine reports the facts, the core decides the risk, the FFI boundary
    # makes the report available. The macOS interface stays open,
    # see docs/acceptance/M2.2-ACCEPTANCE.md.
    - "M2.2"
    # M2.3 covers the inspection of the attachments and the signatures of a
    # document: the engine reads the embedded files and the byte range of the
    # signature, the core decides the risk, the FFI boundary makes the report
    # available. The macOS interface stays open,
    # see docs/acceptance/M2.3-ACCEPTANCE.md.
    - "M2.3"
    # M2.4 covers the comment of the reviewer and the rail of the profession:
    # a standard PDF /Text annotation with a popup, the rail of the
    # profession in the core, the caller sends the key and not a colour, and
    # the note runs as a transaction. The rail of the user is kept on the
    # disk (0600, written atomically, a broken file is an error and not a
    # silent fall back to the standard rail) and the key of the note travels
    # with the document, so a change of the rail does not change the meaning
    # of a note that was written before. The surface of the applications
    # stays open, see docs/acceptance/M2.4-ACCEPTANCE.md.
    - "M2.4"
  license: "AGPL-3.0"
  contribution_model: "DCO"

platforms:
  # The platform order is binding: a new platform track only starts when the
  # previous one has a green release candidate. See CR-0003.
  track_order:
    - "macos"
    - "android"
    - "windows"
    - "linux"
  phase_1:
    macos:
      minimum: "15"
      architecture: "arm64"
      status: "active"
    android:
      minimum_api_family: "Android 13+"
      primary_abi: "arm64-v8a"
      status: "active"
      # M1.6: the native build, the Gradle build, the dependency closure, the
      # 16 KB page alignment and the release package are verified. The on-device
      # run is still NOT RUN, see docs/acceptance/M1-ACCEPTANCE.md.
      verified: "qemu"
      pending: ["on_device_run", "on_device_ocr_quality", "thermal_behaviour"]
  phase_2:
    windows:
      minimum: "11"
      architecture: "x86_64"
      status: "planned"
      change_request: "CR-0003"
    linux:
      minimum: "glibc 2.31+"
      architecture: "x86_64"
      display_servers: ["wayland", "x11"]
      status: "planned"
      change_request: "CR-0003"

architecture:
  shared_core: "Rust"
  macos_ui: "SwiftUI + AppKit"
  android_ui: "Kotlin + Jetpack Compose"
  windows_ui: "TBD via future ADR upon Track 3 entry (CR-0003)"
  linux_ui: "TBD via future ADR upon Track 4 entry (CR-0003)"
  native_bridge: "UniFFI"
  pdf_engine: "MuPDF 1.28.5 via PdfEngine adapter"
  ocr_engine: "Tesseract via OcrProvider"
  office_engine: "TBD via fidelity bake-off"
  job_execution: "Bounded worker pool in vocument-core (ARCHITECTURE.md §8)"

milestones:
  M0: "Foundation / Trustworthy Viewer"
  M1: "Android Scan & OCR"
  M2: "macOS Professional Review"
  M3: "Page Workbench"
  M4: "Authoring / FlowDocument / .pdoc / DOCX / ODT"
  M5: "Windows Shell"
  M6: "Linux Shell"
  M7: "Optional local interfaces (MCP)"

documentation:
  requirements_version: "0.1"
  architecture_version: "0.1"
  roadmap_version: "0.1"
  quality_version: "0.1"

# The decision of the project owner about the licence and the distribution
# (E1-E5). The decision is binding for every further step; the legal review
# that has to precede every publication is still open (E5).
distribution:
  licence: "AGPL-3.0-or-later"
  decision: "docs/decisions/LICENSING-AND-DISTRIBUTION-DECISION.md"
  decision_taken: "2026-10-21"
  # E1: the whole product is open source under the AGPL-3.0-or-later.
  # E2: no proprietary use, no commercial licence of MuPDF.
  # E3: the product is free; services and support are optional.
  # E4: no mandatory service, no cloud, no accounts, no telemetry; the
  #      product is local-first. A server function later needs a new
  #      architecture and licence review.
  # E5: the final legal compliance review is a precondition of every
  #      publication. An agent cannot give that clearance.
  legal_clearance: "open"
  inventory: "THIRD_PARTY.md"
  notices: "LICENSES/THIRD-PARTY-NOTICES.txt"
  build_from_source: "docs/releasing/BUILD-FROM-SOURCE.md"
  release_process: "docs/releasing/RELEASE-PROCESS.md"
  privacy_policy: "PRIVACY.md"
  channels:
    macos_direct:
      status: "prepared-not-signed-not-notarised"
      sandbox: true
      notarisation: "NOT RUN (no macOS host, no Apple credentials)"
    macos_app_store:
      status: "deferred-by-the-decision-of-the-owner-2026-10-21"
      note: "The store conditions of Apple carry obligations that stand next to
        the duties of the AGPL; whether they can be satisfied at the same time
        is an open legal question (E5). The direct distribution comes first.
        No store eligibility is claimed. See RISK-041 and
        docs/audit/store-requirements.md."
    android_google_play:
      status: "prepared-not-signed"
      note: "The build of the bundle exists; the signature and the upload are
        NOT RUN."
    android_direct_apk:
      status: "prepared-not-signed"
    source_archive:
      status: "built-reproducible-in-the-release-candidate"
      note: "The archive of the revision is built twice and compared byte for byte
        (docs/releasing/RELEASE-CANDIDATE.md). It is not published: the legal
        clearance (E5) is open (B-1)."
  # The steps that still have to be taken before anything is handed out.
  # The blockers of a public binary, with their owner and their state:
  # docs/releasing/RELEASE-BLOCKERS.md
  # The continuous integration of the project. Workflows are configured
  # with runs-on: self-hosted per user global standard (RULE[user_global]).
  continuous_integration:
    state: "configured-for-self-hosted-runners"
    runner_policy: "runs-on: self-hosted (enforced by RULE[user_global] and scripts/validate-repo.sh)"
    workflows:
      - ".github/workflows/ci.yml — the gate of the project on Linux"
      - ".github/workflows/ci-macos.yml — the Swift build of the macOS application"
      - ".github/workflows/ci-android.yml — the native libraries and the packages of Android"
    secrets: "none"
    publishes_anything: false
    report: "docs/project/M3-M7-DEVELOPMENT-PLAN.md"
  # The release candidate of the round: internal, not published.
  release_candidate:
    state: "built-internal-not-published"
    script: "scripts/release-candidate.sh"
    check: "scripts/verify-release-candidate.sh"
    report: "docs/releasing/RELEASE-CANDIDATE.md"
    source_archive_reproducible: true
    applications_bit_identical: "not-claimed"
  open_before_publication:
    - "B-1 the legal compliance review of the project owner (E5)"
    - "B-2 the sign and the notarisation of the macOS bundle"
    - "B-3 the sign of the Android artefacts"
    - "B-4 the contact of the responsible person in PRIVACY.md — it must not be invented"
    - "B-5 the build of the source archive with the offer of the source"
    - "B-6 the reproducibility of the build from the archive"
    - "B-7 the decision about the Mac App Store (deferred on 2026-10-21)"
