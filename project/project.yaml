project:
  name: Vocument
  baseline_version: "0.1"
  product_status: "m1-implemented-not-device-verified-m2-started"
  current_milestone: "M2"
  current_milestone_name: "macOS Professional Review"
  current_submilestone: "M2.2"
  completed_milestones:
    - "M0"
  completed_submilestones:
    - "M0.0"
    - "M0.1"
    - "M0.2"
    - "M0.3"
    - "M0.4"
    - "M0.5"
    - "M0.6"
    - "M0.7"
    - "M1.0"
    - "M1.1"
    - "M1.2"
    - "M1.3"
    - "M1.4"
    - "M1.4b"
    - "M1.5"
    # M2.1 covers the secure redaction with its verification in the core, the
    # engine and over the FFI boundary. The macOS interface of the redaction
    # is not part of M2.1 and stays open, see docs/acceptance/M2.1-ACCEPTANCE.md.
    - "M2.1"
    # M2.2 covers the inspection of the links and actions of a document: the
    # engine reports the facts, the core decides the risk, the FFI boundary
    # makes the report available. The macOS interface stays open,
    # see docs/acceptance/M2.2-ACCEPTANCE.md.
    - "M2.2"
  license: "AGPL-3.0"
  contribution_model: "DCO"

platforms:
  # The platform order is binding: a new platform track only starts when the
  # previous one has a green release candidate. See CR-0003.
  track_order:
    - "macos"
    - "android"
    - "windows"
    - "linux"
  phase_1:
    macos:
      minimum: "15"
      architecture: "arm64"
      status: "active"
    android:
      minimum_api_family: "Android 13+"
      primary_abi: "arm64-v8a"
      status: "active"
      # M1.6: the native build, the Gradle build, the dependency closure, the
      # 16 KB page alignment and the release package are verified. The on-device
      # run is still NOT RUN, see docs/acceptance/M1-ACCEPTANCE.md.
      verified: "qemu"
      pending: ["on_device_run", "on_device_ocr_quality", "thermal_behaviour"]
  phase_2:
    windows:
      minimum: "11"
      architecture: "x86_64"
      status: "planned"
      change_request: "CR-0003"
    linux:
      minimum: "glibc 2.31+"
      architecture: "x86_64"
      display_servers: ["wayland", "x11"]
      status: "planned"
      change_request: "CR-0003"

architecture:
  shared_core: "Rust"
  macos_ui: "SwiftUI + AppKit"
  android_ui: "Kotlin + Jetpack Compose"
  windows_ui: "TBD via ADR-0017 (CR-0003)"
  linux_ui: "TBD via ADR-0018 (CR-0003)"
  native_bridge: "UniFFI"
  pdf_engine: "MuPDF 1.28.5 via PdfEngine adapter"
  ocr_engine: "Tesseract via OcrProvider"
  office_engine: "TBD via fidelity bake-off"
  job_execution: "Bounded worker pool in vocument-core (ARCHITECTURE.md §8)"

milestones:
  M0: "Foundation / Trustworthy Viewer"
  M1: "Android Scan & OCR"
  M2: "macOS Professional Review"
  M3: "Page Workbench"
  M4: "Authoring / FlowDocument / .pdoc / DOCX / ODT"
  M5: "Windows Shell"
  M6: "Linux Shell"

documentation:
  requirements_version: "0.1"
  architecture_version: "0.1"
  roadmap_version: "0.1"
  quality_version: "0.1"
