# Central Performance Budgets & Resource Limits (Baseline 0.1)
# Used by JobManager, rendering caches, and QA benchmarks (QUALITY.md, PERF-001).

[startup]
app_start_target_ms = 1000
app_start_max_ms = 1500
first_page_render_target_ms = 300
first_page_render_max_ms = 500

[interaction]
target_scroll_zoom_fps = 60
indexed_search_first_result_target_ms = 150
indexed_search_first_result_max_ms = 300

[rendering_cache]
macos_tile_cache_max_mb = 512
android_tile_cache_max_mb = 192
thumbnail_cache_max_mb = 128
nearby_page_prefetch_radius = 2

[jobs]
max_concurrent_render_workers = 4
max_concurrent_background_ocr_workers = 2
yield_background_on_interaction = true

# M1.5 JobManager capacity limits.
#
# The worker pool is bounded: at most `max_concurrent_workers` jobs run at the same
# time, and at most `max_queued_jobs` may wait in the queue. Submitting beyond
# that limit is rejected with a typed error instead of silently growing memory.
max_concurrent_workers = 4
max_queued_jobs = 256

# A queued job that waits longer than this is promoted by one priority level, so
# that low-priority background work cannot starve indefinitely while interactive
# work keeps arriving (`ARCHITECTURE.md` §8.2).
starvation_promotion_ms = 250

# Longest time a worker waits for new queue entries before shutting down when the
# pool is idle. Keeps shutdown responsive without busy waiting.
idle_shutdown_timeout_ms = 500

# Longest time the pool waits for a worker to end when the pool is shut down.
# A worker that is stuck inside an engine call cannot be stopped from the outside;
# after this grace period it is detached, so that the application can still exit.
shutdown_grace_ms = 2000

[code_limits]
target_max_lines_per_file = 600
hard_max_lines_per_file = 900

