[package]
name = "vocument-pdf-mupdf"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
vocument-core = { path = "../../core/vocument-core" }
thiserror.workspace = true

[dev-dependencies]
# Only the tests measure the peak memory of the process, and the standard
# library of Rust does not offer that on every platform.
libc.workspace = true

[build-dependencies]
cc.workspace = true

[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
